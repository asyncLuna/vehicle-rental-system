spring:
  application.name: customer-service
  datasource.url: ${DB_URL:jdbc:postgresql://localhost:5432/vehicle_rental_system}
  datasource.username: ${DB_USERNAME:vehicle-rental-system}
  datasource.password: ${DB_PASSWORD:vehicle-rental-system}
  jpa.hibernate.ddl-auto: update
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include: health,info,metrics,circuitbreakers
resilience4j.circuitbreaker.instances.customerService.sliding-window-size: 10
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold: 50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state: 10s
