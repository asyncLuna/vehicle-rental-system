server.port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
management.endpoints.web.exposure.include: health,info
resilience4j.circuitbreaker.instances.discoveryServer.sliding-window-size: 10
resilience4j.circuitbreaker.instances.discoveryServer.failure-rate-threshold: 50
resilience4j.circuitbreaker.instances.discoveryServer.wait-duration-in-open-state: 10s
